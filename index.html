<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server MOTD</title>
    <style>
        body {
            background-color: #FFFFFF;
            color: #ffffff;
            font-family: "Malgun Gothic", sans-serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 95%; 
            max-width: 1000px; /* 너비 대폭 확장 */
            background: #2d2d2d;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 2px solid #444;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2, #2c3e50);
            padding: 60px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 4.5em; /* 제목 엄청 크게 */
            text-shadow: 4px 4px 8px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 1.8em; /* 부제목 크게 */
            margin-top: 20px;
            color: #e0e0e0;
        }

        .content {
            padding: 50px;
        }

        .section h2 {
            color: #4a90e2;
            border-bottom: 4px solid #4a90e2;
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-size: 2.5em; /* 섹션 제목 크게 */
        }

        li {
            padding: 20px 0;
            border-bottom: 1px solid #444;
            font-size: 1.6em; /* 규칙 텍스트 아주 크게 */
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background: #4a90e2;
            color: white;
            padding: 25px 50px; /* 버튼 크기 킹사이즈 */
            text-decoration: none;
            border-radius: 12px;
            margin-top: 30px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .footer {
            background: #222;
            padding: 30px;
            text-align: center;
            font-size: 1.2em;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>빅시티 시민공원</h1>
        <p>환영합니다! 매너 있는 플레이를 부탁드립니다.</p>
    </div>

    <div class="content">
        <div class="section">
            <h2>📜 서버 규칙</h2>
            <ul>
                <li>욕설 및 타인 비하 발언 즉시 차단</li>
                <li>프랍 스팸 및 서버 렉 유발 절대 금지</li>
                <li>어드민 지시 불응 시 서버 이용 제한</li>
                <li>모든 버그 악용 행위 금지</li>
            </ul>
        </div>

        <div class="section">
            <h2>🔗 주요 링크</h2>
            <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3661460068" class="btn">창작마당 모음집 바로가기</a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 빅시티 시민공원. All Rights Reserved.
    </div>
</div>

</body>
</html>
