<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server MOTD</title>
    <style>
        body {
            background-color: #f4f6f9;
            color: #1a1a1a;
            font-family: "Malgun Gothic", sans-serif;
            margin: 0;
            padding: 30px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 95%; 
            max-width: 800px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            border: 1px solid #e1e4e8;
            overflow: hidden;
        }

        /* 배경 이미지가 들어가는 헤더 */
        .header {
            position: relative;
            padding: 70px 30px;
            text-align: center;
            background-image: url('https://www.dropbox.com/scl/fi/z5edm46mpj6llcrxt9se9/Gemini_Generated_Image_7epauc7epauc7epa.png?rlkey=kv2e929tsuoa6ux5mwzi3lrqd&st=9ah9gwhl&dl=1');
            background-size: cover;
            background-position: center;
            color: #ffffff;
        }

        /* 글자 가독성을 위한 반투명 덮개 */
        .header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .header h1, .header p {
            position: relative;
            z-index: 2;
            margin: 0;
        }

        .header h1 {
            font-size: 3em;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
        }

        .header p {
            font-size: 1.3em;
            margin-top: 10px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .section h2 {
            color: #333;
            border-left: 5px solid #8ab4f8; /* 버튼과 맞춘 연한 파랑 포인트 */
            padding-left: 15px;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        li {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 1.2em;
            color: #444;
        }

        /* ✨ 요청하신 연한 파란색 버튼 스타일 */
        .btn {
            display: inline-block;
            background-color: #8ab4f8; /* 연한 파랑 (Sky Blue계열) */
            color: #ffffff;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 30px; /* 둥근 버튼 형태 */
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 15px;
            transition: 0.2s ease;
            box-shadow: 0 4px 10px rgba(138, 180, 248, 0.3);
        }

        .btn:hover {
            background-color: #6a9df5; /* 마우스 올렸을 때 약간 더 진하게 */
            transform: translateY(-2px);
        }

        .footer {
            background: #fafafa;
            padding: 20px;
            text-align: center;
            color: #bbb;
            font-size: 0.95em;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>빅시티 자유공원</h1>
        <p>환영합니다! 좋은 시간 보내세요!.</p>
    </div>

    <div class="content">
        <div class="section">
            <h2>📜 서버 규칙</h2>
            <ul>
                <li>욕설 및 타인 비하 발언 금지</li>
                <li>무분별한 프랍 소환 및 렉 유발 금지</li>
                <li>관리자 호출 시 정중한 태도 유지</li>
                <li>비인가 프로그램 및 버그 악용 절대 금지</li>
            </ul>
        </div>

        <div class="section">
            <h2>🔗 주요 링크</h2>
            <a href="https://steamcommunity.com" class="btn">창작마당 모음집</a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 빅시티 시민공원. All Rights Reserved.
    </div>
</div>

</body>
</html>
