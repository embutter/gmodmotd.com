<html lang="ko">
<head>

    <title>Server MOTD</title>

            color: #ffffff;

            margin: 0;
            padding: 40px 20px; /* 상하 여백 증가 */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 위쪽부터 정렬 */
            min-height: 100vh;
        }

        .container {
            width: 95%; /* 너비 확장 */
            max-width: 1000px; /* 최대 너비 확장 */
            background: #2d2d2d;
            border-radius: 15px; /* 곡률 증가 */
            box-shadow: 0 15px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid #444;
        }

        .header {
            background: linear-gradient(135deg, #4a90e2, #2c3e50);
            padding: 50px 30px; /* 헤더 높이 증가 */
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 3.5em; /* 제목 크게 */
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.4em; /* 부제목 크게 */
            margin-top: 15px;
            opacity: 0.9;
        }

        .content {
            padding: 40px; /* 내부 여백 증가 */
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #4a90e2;
            border-bottom: 3px solid #4a90e2; /* 선 두께 증가 */
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 2em; /* 섹션 제목 크게 */
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 15px 0; /* 목록 간격 증가 */
            border-bottom: 1px solid #3d3d3d;
            font-size: 1.3em; /* 규칙 텍스트 크게 */
            line-height: 1.6;
        }

        li:before {
            content: "✔ "; /* 체크 표시로 변경 */
            color: #4a90e2;
            font-weight: bold;
            margin-right: 10px;
        }

        .footer {
            background: #222;
            padding: 20px;
            text-align: center;
            font-size: 1.1em;
            color: #888;
        }
