<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server MOTD</title>
    <style>
        body {
            background-color: #f0f2f5; /* 연한 회색 배경 */
            color: #1a1a1a; /* 검은색 텍스트 */
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 90%; 
            max-width: 850px; /* 사이즈를 약간 줄임 */
            background: #ffffff; /* 흰색 배경 */
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); /* 그림자를 부드럽게 */
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .header {
            background: #ffffff; /* 헤더도 흰색 */
            padding: 40px 30px;
            text-align: center;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            margin: 0;
            font-size: 3em; /* 제목 사이즈 적당히 조절 */
            color: #000000;
            font-weight: 800;
        }

        .header p {
            font-size: 1.3em;
            margin-top: 10px;
            color: #666;
        }

        .content {
            padding: 35px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #000000;
            border-left: 5px solid #4a90e2; /* 왼쪽에 강조 선 추가 */
            padding-left: 15px;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 1.25em; /* 텍스트 크기 적당히 크게 */
            line-height: 1.6;
            color: #333;
        }

        li:before {
            content: "■ ";
            color: #4a90e2;
            font-size: 0.8em;
            margin-right: 10px;
        }

        .btn {
            display: inline-block;
            background: #000000; /* 버튼은 검은색으로 포인트 */
            color: #ffffff;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .btn:hover {
            background: #333333;
        }

        .footer {
            background: #fafafa;
            padding: 20px;
            text-align: center;
            font-size: 1em;
            color: #aaa;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>빅시티 시민공원</h1>
        <p>쾌적한 환경을 위해 규칙을 준수해 주세요.</p>
    </div>

    <div class="content">
        <div class="section">
            <h2>📜 서버 규칙</h2>
            <ul>
                <li>욕설, 비하 발언 및 정치적 발언 금지</li>
                <li>무분별한 프랍 소환 및 렉 유발 금지</li>
                <li>관리자 호출 시 정중한 태도 유지</li>
                <li>비인가 프로그램 및 버그 악용 절대 금지</li>
            </ul>
        </div>

        <div class="section">
            <h2>🔗 주요 링크</h2>
            <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3661460068" class="btn">창작마당 모음집</a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 빅시티 시민공원.
    </div>
</div>

</body>
</html>
