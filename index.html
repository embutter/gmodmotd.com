<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server MOTD</title>
    <style>
        body {
            background-color: #f0f2f5;
            color: #1a1a1a;
            font-family: "Malgun Gothic", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 90%; 
            max-width: 850px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            overflow: hidden;
        }

        /* 🖼️ 배경 이미지가 들어가는 헤더 영역 */
        .header {
            position: relative;
            padding: 80px 30px; /* 높이를 조금 더 키웠습니다 */
            text-align: center;
            /* 아래 url 안에 이미지 주소를 넣으세요 */
            background-image: url('https://www.dropbox.com/scl/fi/ldqc068mxciwzyvbd7qa4/20260209113408_1.jpg?rlkey=rapovleufh6guc2cpss0ib4mq&st=w6tnlzq9&dl=1');
            background-size: cover;
            background-position: center;
            color: #ffffff; /* 배경이 있으므로 글자는 흰색으로 고정 */
        }

        /* 글자를 잘 보이게 하기 위한 어두운 덮개 (Overlay) */
        .header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); /* 0.4를 높이면 더 어두워집니다 */
            z-index: 1;
        }

        /* 헤더 안의 텍스트들을 덮개 위로 올림 */
        .header h1, .header p {
            position: relative;
            z-index: 2;
            margin: 0;
        }

        .header h1 {
            font-size: 3.2em;
            font-weight: 800;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        }

        .header p {
            font-size: 1.4em;
            margin-top: 15px;
            opacity: 0.9;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
        }

        .content {
            padding: 40px;
        }

        .section h2 {
            color: #000;
            border-left: 6px solid #4a90e2;
            padding-left: 15px;
            margin-bottom: 20px;
            font-size: 2em;
        }

        li {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 1.3em;
            color: #333;
        }

        .btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .footer {
            background: #fafafa;
            padding: 20px;
            text-align: center;
            color: #aaa;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>빅시티 시민공원</h1>
        <p>쾌적한 환경을 위해 규칙을 준수해 주세요.</p>
    </div>

    <div class="content">
        <div class="section">
            <h2>📜 서버 규칙</h2>
            <ul>
                <li>욕설 및 타인 비하 발언 금지</li>
                <li>무분별한 프랍 소환 및 렉 유발 금지</li>
                <li>관리자 호출 시 정중한 태도 유지</li>
                <li>비인가 프로그램 및 버그 악용 절대 금지</li>
            </ul>
        </div>

        <div class="section">
            <h2>🔗 주요 링크</h2>
            <a href="https://steamcommunity.com" class="btn">창작마당 모음집 바로가기</a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 빅시티 시민공원.
    </div>
</div>

</body>
</html>
