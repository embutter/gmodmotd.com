<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Server MOTD</title>
    <style>
        body {
            background-color: #f0f2f5;
            color: #1a1a1a;
            font-family: "Malgun Gothic", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 90%; 
            max-width: 800px; /* 요청하신 대로 조금 더 줄인 사이즈 */
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .header {
            padding: 40px 30px;
            text-align: center;
            border-bottom: 2px solid #eee;
        }

        /* 추가된 이미지 스타일 */
        .server-logo {
            width: 100%; /* 컨테이너 너비에 맞춤 */
            max-width: 400px; /* 로고가 너무 크면 여기서 조절 */
            height: auto;
            margin-bottom: 20px; /* 글자와의 간격 */
            border-radius: 8px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.8em;
            color: #000;
            font-weight: 800;
        }

        .header p {
            font-size: 1.2em;
            margin-top: 10px;
            color: #666;
        }

        .content {
            padding: 30px;
        }

        .section h2 {
            color: #000;
            border-left: 5px solid #4a90e2;
            padding-left: 15px;
            margin-bottom: 15px;
            font-size: 1.7em;
        }

        li {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 1.15em;
            color: #333;
        }

        .btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .footer {
            background: #fafafa;
            padding: 15px;
            text-align: center;
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://www.dropbox.com/scl/fi/ldqc068mxciwzyvbd7qa4/20260209113408_1.jpg?rlkey=rapovleufh6guc2cpss0ib4mq&st=w6tnlzq9&dl=1" alt="서버 로고" class="server-logo">
        
        <h1>빅시티 시민공원</h1>
        <p>쾌적한 환경을 위해 규칙을 준수해 주세요.</p>
    </div>

    <div class="content">
        <div class="section">
            <h2>📜 서버 규칙</h2>
            <ul>
                <li>욕설 및 타인 비하 발언 금지</li>
                <li>무분별한 프랍 소환 및 렉 유발 금지</li>
                <li>관리자 호출 시 정중한 태도 유지</li>
                <li>비인가 프로그램 및 버그 악용 절대 금지</li>
            </ul>
        </div>

        <div class="section">
            <h2>🔗 주요 링크</h2>
            <a href="https://steamcommunity.com" class="btn">창작마당 모음집</a>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 빅시티 시민공원.
    </div>
</div>

</body>
</html>
